[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "donstu-sdk"
version = "0.1.0"
description = "Python SDK for the DSTU/MMISLab API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
license = {text = "MIT"}
authors = [{name = "localzet"}]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/donstu_sdk"]

[tool.hatch.build]
include = ["src/donstu_sdk/**/*.py", "src/donstu_sdk/resources/routes.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
